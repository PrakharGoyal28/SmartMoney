services:
  front:
    build: 
      context: './client'
      dockerfile: Dockerfile
    ports:
      - 3000:3000
      
    container_name: react-container

    networks:
      - mern-stack-networks

    volumes:
      - ./client:/app

    depends_on:
      - backend
      

  backend:
    build:
      context: './server' 
      dockerfile: Dockerfile

    ports: 
      - 12000:12000
    
    container_name: express-container

    networks:
      - mern-stack-networks

    volumes:
      - ./server:/app

    environment:
      - NODE_ENV=development


networks:

  mern-stack-networks:







    
    
